<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光 · 家庭相册</title><link rel="stylesheet" href="/static/style.css?v=0.1.1"><body>
<section id="login" class="login"><div class="flower">✺</div><h1>拾光</h1><p id="loginHint">让每一段记忆，都有归处。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button>进入相册</button></form><small id="loginError"></small></section>
<div id="app" hidden><aside><div class="brand"><span class="flower">✺</span> 拾光 <small>PHOTOS</small></div><div class="label">资料库</div><button class="nav active" data-view="all">▦　所有照片</button><button class="nav" data-view="video">▷　视频</button><button class="nav" data-view="places">◎　地点</button><div class="label">管理</div><button class="nav" data-view="shares">↗　分享管理</button><button class="nav" data-view="trash">♲　最近删除</button><button class="nav" id="settings">⚙　图库设置</button><div class="aside-bottom">你的记忆，留在你的硬盘上。<button id="logout">退出登录</button></div></aside>
<main><header><div><div class="eyebrow">YOUR MOMENTS, TOGETHER</div><h1 id="title">所有照片</h1><p id="count">属于家人的时光收藏</p></div><button id="scan">↻ 扫描图库</button></header><section id="progress" hidden><b id="phase"></b><progress id="bar" max="100"></progress><small id="scanCount"></small></section><div id="notice"></div><div id="gallery"></div><button id="more" hidden>加载更多</button></main></div>
<dialog id="config" aria-labelledby="folderTitle"><h2 id="folderTitle">选择照片目录</h2><p>可以选择多个目录，首次使用需完成绑定。只显示 Docker 已挂载的照片目录。</p><div id="folderRoots"></div><div id="folderPath"></div><div id="currentFolder"></div><p id="folderHint"></p><div id="folders"></div><div class="selected-section"><b id="selectionCount">尚未选择目录</b><div id="selectedFolders"></div></div><p id="folderError" role="alert" hidden></p><button id="saveFolder" disabled>保存所选目录并扫描</button></dialog>
<dialog id="viewer"><div class="viewer-toolbar"><button id="closeViewer">✕</button><span id="filename"></span><div><button id="info">信息</button><a id="download">下载</a><button id="share">分享</button><button id="delete">删除</button></div></div><div id="mediaView"></div><pre id="details" hidden></pre></dialog>
<dialog id="shareDialog"><h2>分享这一刻</h2><form id="shareForm"><label>有效天数<input id="days" type="number" min="1" max="365" value="7"></label><label>访问密码（可选）<input id="sharePassword" type="password"></label><label><input type="checkbox" id="allowDownload"> 允许下载原文件（可能包含 GPS）</label><p>分享预览使用原文件，不展示信息面板。</p><button>创建链接</button><button type="button" onclick="document.querySelector('#shareDialog').close()">关闭</button></form><input id="shareResult" readonly hidden></dialog><div id="toast"></div><script src="/static/folder-picker.js?v=0.1.1"></script><script src="/static/app.js?v=0.1.1"></script></body></html>
