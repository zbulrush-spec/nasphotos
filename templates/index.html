<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>拾光 · 家庭相册</title><link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="/static/style.css?v=0.2.0"></head><body>
<section id="login" class="login"><div class="flower">✺</div><h1>拾光</h1><p id="loginHint">让每一段记忆，都有归处。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button>进入相册</button></form><small id="loginError"></small></section>
<div id="app" hidden><aside><div class="brand"><span class="flower">✺</span> 拾光 <small>PHOTOS</small></div><div class="label">资料库</div><button class="nav active" data-view="all">▦　所有照片</button><button class="nav" data-view="video">▷　视频</button><button class="nav" data-view="places">◎　地点</button><button class="nav" data-view="people">◉　人物</button><div class="label">管理</div><button class="nav" data-view="shares">↗　分享管理</button><button class="nav" data-view="trash">♲　最近删除</button><button class="nav" data-view="settings" id="settings">⚙　图库设置</button><div class="aside-bottom">你的记忆，留在你的硬盘上。<button id="logout">退出登录</button></div></aside>
<main><header><div><div class="eyebrow">YOUR MOMENTS, TOGETHER</div><h1 id="title">所有照片</h1><p id="count">属于家人的时光收藏</p></div></header>
<section id="progress" hidden aria-live="polite"><div class="progress-heading"><b id="phase"></b><button id="dismissScan" aria-label="关闭扫描提示" hidden>✕</button></div><progress id="bar" max="100"></progress><small id="scanCount"></small></section><div id="notice" role="status"></div>
<section id="config" hidden aria-labelledby="folderTitle"><h2 id="folderTitle">照片目录</h2><p>选择一个或多个目录及其子目录，只显示 Docker 已挂载的照片目录。</p><div id="folderRoots"></div><div id="folderPath"></div><div id="currentFolder"></div><p id="folderHint"></p><div id="folders"></div><div class="selected-section"><b id="selectionCount">尚未选择目录</b><div id="selectedFolders"></div></div><p id="folderError" role="alert" hidden></p><div class="settings-actions"><button id="saveFolder" disabled>保存所选目录</button><button id="scan">↻ 扫描图库</button></div><section class="recognition-settings"><h2>人脸识别</h2><p>在本机使用 buffalo_l 识别照片中的人物，照片和人脸数据保存在你的 NAS。扫描新照片后可增量识别。</p><label for="recognitionKey">本地识别服务密钥（API_AUTH_KEY）<input id="recognitionKey" type="password" minlength="32" maxlength="256" autocomplete="new-password" placeholder="至少32个字符；留空不修改"></label><button id="saveRecognitionKey" type="button">保存密钥</button><p id="recognitionKeyStatus" role="status">密钥自动生成并保存在配置数据库中。</p><button id="recognize">识别图库人物</button><p id="recognitionStatus" role="status"></p></section></section>
<section id="placesPanel" hidden><div id="map" aria-label="照片地点地图"></div><p class="map-hint">点击照片数量逐级放大，点击最小范围查看该区域照片。底图需要联网。</p><button id="clearRegion" hidden>返回全部地点</button></section>
<section id="personPanel" hidden><button id="backPeople">← 返回人物</button><button id="renamePerson">命名人物</button></section>
<div id="gallery"></div><div id="loadSentinel" hidden aria-live="polite"></div><button id="retryLoad" hidden>重试加载</button></main></div>
<dialog id="viewer"><div class="viewer-toolbar"><button id="closeViewer" aria-label="关闭详情">✕</button><span id="filename"></span><div><button id="info">信息</button><a id="download">下载</a><button id="share">分享</button><button id="delete">删除</button><button id="restore" hidden>恢复</button></div></div><div id="mediaView"></div><pre id="details" hidden></pre></dialog>
<dialog id="shareDialog"><h2>分享这一刻</h2><form id="shareForm"><label>有效天数<input id="days" type="number" min="1" max="365" value="7"></label><label>访问密码（可选）<input id="sharePassword" type="password"></label><label><input type="checkbox" id="allowDownload"> 允许下载原文件（可能包含 GPS）</label><p>分享预览使用原文件，不展示信息面板。</p><button>创建链接</button><button type="button" id="closeShare">关闭</button></form><input id="shareResult" readonly hidden></dialog><div id="toast" role="status"></div>
<script src="/static/vendor/leaflet/leaflet.js"></script><script src="/static/folder-picker.js?v=0.2.0"></script><script src="/static/app.js?v=0.2.1"></script></body></html>
